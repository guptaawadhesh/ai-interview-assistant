spring:
  application:
    name: ai-interview-assistant

ollama:
  base-url: http://localhost:11434
  model: gemma3:4b

gemini:
  base-url: https://generativelanguage.googleapis.com
  api-key: ${GEMINI_API_KEY}
  model: gemini-3.6-flash
  temperature: 0.7
  max-output-tokens: 1024

ai:
  default-provider: gemini